name: Bygg og publiser

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: node --test tests/*.test.js

      - name: Bygg
        run: python3 build.py

      - uses: actions/upload-artifact@v4
        with:
          name: public
          path: public/
          include-hidden-files: true

  deploy:
    # Publiserer bare fra main, og bare når SSH-hemmelighetene er lagt inn.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: produksjon
    env:
      PROISP_HOST: ${{ secrets.PROISP_HOST }}
      PROISP_USER: ${{ secrets.PROISP_USER }}
      PROISP_PORT: ${{ secrets.PROISP_PORT || '443' }}
      PROISP_PATH: ${{ secrets.PROISP_PATH }}
    steps:
      - name: Sjekk oppsett
        id: oppsett
        run: |
          if [ -z "$PROISP_HOST" ] || [ -z "$PROISP_USER" ] || [ -z "$PROISP_PATH" ]; then
            echo "::notice::PROISP_HOST, PROISP_USER eller PROISP_PATH er ikke satt. Hopper over publisering."
            echo "klar=nei" >> "$GITHUB_OUTPUT"
          else
            echo "klar=ja" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.oppsett.outputs.klar == 'ja'
        with:
          name: public
          path: public/

      - name: Sett opp SSH
        if: steps.oppsett.outputs.klar == 'ja'
        env:
          SSH_KEY: ${{ secrets.PROISP_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2> "$RUNNER_TEMP/keygen.err"; then
            echo "::error::PROISP_SSH_KEY er ikke en gyldig privat nøkkel. Lim inn hele filen, fra BEGIN- til og med END-linjen."
            exit 1
          fi
          if ! ssh-keyscan -T 15 -p "$PROISP_PORT" -H "$PROISP_HOST" > ~/.ssh/known_hosts 2> "$RUNNER_TEMP/keyscan.err" || [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Fikk ikke kontakt med SSH-serveren på port $PROISP_PORT. Sjekk at PROISP_HOST bare er vertsnavnet (uten ssh:// eller brukernavn) og at porten er riktig."
            cat "$RUNNER_TEMP/keyscan.err"
            exit 1
          fi

      - name: Sjekk at målmappen finnes
        if: steps.oppsett.outputs.klar == 'ja'
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $PROISP_PORT -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes $PROISP_USER@$PROISP_HOST"
          if ! $SSH "test -d '$PROISP_PATH' && test -w '$PROISP_PATH'"; then
            echo "::error::Målmappen $PROISP_PATH finnes ikke eller er ikke skrivbar for brukeren $PROISP_USER. Sjekk PROISP_PATH og PROISP_USER."
            echo "Mapper brukeren kan se under webroots:"
            $SSH 'ls -la "$HOME/webroots" 2>&1 | head -30' || true
            exit 1
          fi
          echo "Målmappen finnes: $PROISP_PATH"

      - name: Last opp til ProISP (rsync over SSH)
        if: steps.oppsett.outputs.klar == 'ja'
        run: |
          rsync -rltz --chmod=D755,F644 \
            -e "ssh -i $HOME/.ssh/deploy_key -p $PROISP_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes" \
            public/ "$PROISP_USER@$PROISP_HOST:$PROISP_PATH/"

      - name: Verifiser at domenet viser den nye versjonen
        if: steps.oppsett.outputs.klar == 'ja'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://sokkelreiser.no' }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $PROISP_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes $PROISP_USER@$PROISP_HOST"
          echo "Lastet opp til: $PROISP_PATH"
          $SSH "cat '$PROISP_PATH/versjon.txt'" || true
          for i in 1 2 3 4 5 6; do
            live=$(curl -fsSL -H 'Cache-Control: no-cache' "$SITE_URL/versjon.txt?t=$(date +%s)" | tr -d '[:space:]' || true)
            [ "$live" = "$GITHUB_SHA" ] && { echo "OK: $SITE_URL viser $GITHUB_SHA"; exit 0; }
            sleep 10
          done
          echo "::error::Opplastingen gikk til $PROISP_PATH, men $SITE_URL viser en annen versjon ('${live:-ingen versjon.txt}'). PROISP_PATH peker trolig ikke på mappen domenet bruker. Sjekk dokumentrot for sokkelreiser.no i ProISP-kontrollpanelet."
          echo "Mapper under webroots:"
          $SSH 'echo "HOME=$HOME"; ls -la "$HOME/webroots" 2>&1 | head -20; ls -la "$HOME" 2>&1 | head -25' | sed 's/^/::notice::/' || true
          exit 1
