name: Bygg og publiser

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: node --test tests/*.test.js

      - name: Bygg
        run: python3 build.py

      - uses: actions/upload-artifact@v4
        with:
          name: public
          path: public/
          include-hidden-files: true

  deploy:
    # Publiserer bare fra main, og bare når SSH-hemmelighetene er lagt inn.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: produksjon
    env:
      PROISP_HOST: ${{ secrets.PROISP_HOST }}
      PROISP_USER: ${{ secrets.PROISP_USER }}
      PROISP_PORT: ${{ secrets.PROISP_PORT }}
      PROISP_PATH: ${{ secrets.PROISP_PATH }}
    steps:
      - name: Sjekk oppsett
        id: oppsett
        run: |
          if [ -z "$PROISP_HOST" ] || [ -z "$PROISP_USER" ] || [ -z "$PROISP_PATH" ]; then
            echo "::notice::PROISP_HOST, PROISP_USER eller PROISP_PATH er ikke satt. Hopper over publisering."
            echo "klar=nei" >> "$GITHUB_OUTPUT"
          else
            echo "klar=ja" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.oppsett.outputs.klar == 'ja'
        with:
          name: public
          path: public/

      - name: Sett opp SSH
        if: steps.oppsett.outputs.klar == 'ja'
        env:
          SSH_KEY: ${{ secrets.PROISP_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${PROISP_PORT:-22}" -H "$PROISP_HOST" >> ~/.ssh/known_hosts

      - name: Last opp til ProISP (rsync over SSH)
        if: steps.oppsett.outputs.klar == 'ja'
        run: |
          rsync -rltz --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key -p ${PROISP_PORT:-22} -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes" \
            public/ "$PROISP_USER@$PROISP_HOST:$PROISP_PATH"

      - name: Verifiser at siden er oppe
        if: steps.oppsett.outputs.klar == 'ja' && vars.SITE_URL != ''
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "${{ vars.SITE_URL }}")
          echo "HTTP $code fra ${{ vars.SITE_URL }}"
          test "$code" = "200"
