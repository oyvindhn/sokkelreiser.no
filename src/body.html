<div class="app">
  <aside class="panel" aria-label="Logg">
    <header class="brand">
      <div>
        <h1>Offshore<b>kart</b></h1>
        <p>Hvor var du – og hvor var riggen?</p>
      </div>
      <div style="position:relative;display:flex;gap:6px">
        <button class="icon-btn" id="btnImport" type="button">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2v8m0 0L5 7m3 3 3-3M3 12v2h10v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Importer
        </button>
        <button class="icon-btn" id="btnMenu" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Flere valg">
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.4" fill="currentColor"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="13" cy="8" r="1.4" fill="currentColor"/></svg>
        </button>
        <div class="menu" id="menu" hidden>
          <button type="button" data-act="add">Legg til opphold manuelt</button>
          <button type="button" data-act="csv">Last ned opphold (CSV)</button>
          <button type="button" data-act="copy">Kopier opphold som tabell</button>
          <button type="button" data-act="save">Lagre prosjektfil (JSON)</button>
          <hr>
          <button type="button" data-act="sodir">Oppdater data fra Sodir</button>
          <button type="button" data-act="clear" class="danger">Slett alle data i denne nettleseren</button>
        </div>
        <input type="file" id="file" accept=".xlsx,.csv,.txt,.json" hidden>
      </div>
    </header>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-stays" aria-selected="true" data-tab="stays" type="button">Mine opphold</button>
      <button class="tab" role="tab" id="tab-rig" aria-selected="false" data-tab="rig" type="button">Rigghistorikk</button>
      <button class="tab" role="tab" id="tab-places" aria-selected="false" data-tab="places" type="button">Installasjoner<span class="count" id="placeCount" hidden></span></button>
    </nav>
    <section class="view" id="view-stays" role="tabpanel"></section>
    <section class="view" id="view-rig" role="tabpanel" hidden></section>
    <section class="view" id="view-places" role="tabpanel" hidden></section>
  </aside>

  <main class="chart" aria-label="Kart">
    <canvas id="map"></canvas>
    <div class="ov legend" id="legend">
      <div><svg width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" fill="var(--accent)"/></svg>Fast installasjon</div>
      <div><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 .8 11.2 6 6 11.2.8 6Z" fill="var(--accent)"/></svg>Flyttbar rigg – lokasjon</div>
      <div><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 .8 11.2 6 6 11.2.8 6Z" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="2 1.5"/></svg>Usikker posisjon</div>
      <div><svg width="18" height="12" viewBox="0 0 18 12"><path d="M1 6h16" stroke="var(--trail)" stroke-width="1.3" stroke-dasharray="3 2.5"/></svg>Riggens flytting</div>
    </div>
    <div class="ov zoom">
      <button type="button" id="zin" aria-label="Zoom inn">+</button>
      <button type="button" id="zout" aria-label="Zoom ut">−</button>
      <button type="button" id="zfit" aria-label="Vis alt" style="font-size:13px">⤢</button>
    </div>
    <div class="ov readout mono" id="readout"></div>
    <div class="ov source" id="source"><i></i><span id="sourceText">Sodir: ikke lastet</span></div>
    <div class="ov pickbar" id="pickbar" hidden><span id="pickText">Klikk i kartet for å plassere</span><button class="btn small" type="button" id="pickCancel">Avbryt</button></div>
    <div class="tip" id="tip" hidden></div>
  </main>
</div>

<dialog id="dlgImport"><form class="dlg" method="dialog" id="importForm"></form></dialog>
<dialog id="dlgAdd"><form class="dlg" method="dialog" id="addForm"></form></dialog>
<dialog id="dlgConfirm"><form class="dlg" method="dialog" id="confirmForm"></form></dialog>
<div class="toast" id="toast" hidden></div>
